#!/usr/sbin/nft -f

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        # 1. Izinkan lalu lintas lokal (loopback)
        iifname "lo" accept

        # 2. Izinkan koneksi yang sudah terjalin (established/related)
        ct state established,related accept

        # 3. Izinkan akses SSH (22), HTTP (80), dan HTTPS (443)
        tcp dport { 22, 80, 443 } accept

        # 4. Izinkan protokol ICMP (Ping) untuk diagnosa jaringan
        meta l4proto icmp accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}